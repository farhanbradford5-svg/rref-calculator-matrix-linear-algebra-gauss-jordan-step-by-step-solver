kind = "web"
previewPath = "/"
title = "RREF Calculator"
version = "1.0.0"
id = "artifacts/rref-calculator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20652

[services.development]
run = "pnpm --filter @workspace/rref-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rref-calculator", "run", "build" ]
publicDir = "artifacts/rref-calculator/out"
serve = "static"

[services.env]
PORT = "20652"
BASE_PATH = "/"
